[project]
name = "chemi-backend"
version = "0.2.0"
description = "CHEMI chemistry tutor as a Cloudflare Python Worker"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "httpx",
    "langgraph<1",
    "langchain-core<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
