[project]
name = "chemi-backend"
version = "0.2.0"
description = "CHEMI chemistry tutor as a Cloudflare Python Worker"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "httpx",
    "langchain<1",
    "langgraph<1",
    "langchain-openai<1",
]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]
